<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0E11"/>
      <stop offset="0.55" stop-color="#12161C"/>
      <stop offset="1" stop-color="#1A1F27"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FCD535"/>
      <stop offset="1" stop-color="#F0B90B"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1E2329"/>
      <stop offset="1" stop-color="#161A1F"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="22%" r="45%">
      <stop offset="0%" stop-color="#FCD535" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FCD535" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="18%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#0ECB81" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0ECB81" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="url(#gold)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.07" stroke="#EAECEF" stroke-width="1">
    <path d="M80 140 H1120"/>
    <path d="M80 220 H700"/>
    <path d="M80 480 H1120"/>
  </g>

  <!-- Brand mark -->
  <g transform="translate(72, 56)">
    <rect width="52" height="52" rx="12" fill="#161A1F" stroke="#343B44"/>
    <path d="M19 16C16.2 16 14 18.5 14 21.8V28.2C14 31.5 16.2 34 19 34C20.8 34 22.3 33 23 31.5" stroke="#EAECEF" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M25 33.5V19.5L29.5 28L34 19.5V33.5" stroke="#EAECEF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="34.2" cy="17.5" r="1.6" fill="#FCD535"/>
    <text x="64" y="28" fill="#EAECEF" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="700">Crypto Market</text>
    <text x="64" y="48" fill="#FCD535" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">VN</text>
  </g>

  <!-- Main headline -->
  <text x="72" y="200" fill="#EAECEF" font-family="Segoe UI, system-ui, sans-serif" font-size="54" font-weight="700">Nắm bắt thị trường crypto</text>
  <text x="72" y="262" fill="#EAECEF" font-family="Segoe UI, system-ui, sans-serif" font-size="54" font-weight="700">mỗi ngày</text>
  <text x="72" y="318" fill="#929AA5" font-family="Segoe UI, system-ui, sans-serif" font-size="22">Giá realtime · Fear &amp; Greed · Chart nến · Tin tiếng Việt</text>

  <!-- CTA pills -->
  <g transform="translate(72, 360)">
    <rect width="168" height="48" rx="10" fill="url(#gold)"/>
    <text x="84" y="31" text-anchor="middle" fill="#181A20" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700">Thị trường</text>
    <rect x="184" y="0" width="132" height="48" rx="10" fill="#1E2329" stroke="#2B3139"/>
    <text x="250" y="31" text-anchor="middle" fill="#EAECEF" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600">Tin tức</text>
  </g>

  <!-- Right side mini dashboard cards -->
  <g filter="url(#soft)" transform="translate(700, 120)">
    <!-- BTC card -->
    <rect width="200" height="118" rx="16" fill="url(#card)" stroke="#2B3139"/>
    <circle cx="36" cy="40" r="14" fill="#F7931A"/>
    <text x="58" y="46" fill="#EAECEF" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">BTC</text>
    <text x="24" y="84" fill="#EAECEF" font-family="IBM Plex Mono, Consolas, monospace" font-size="22" font-weight="700">$64,845</text>
    <text x="24" y="106" fill="#0ECB81" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" font-weight="600">+1.09%</text>

    <!-- ETH card -->
    <rect x="216" y="0" width="200" height="118" rx="16" fill="url(#card)" stroke="#2B3139"/>
    <circle cx="252" cy="40" r="14" fill="#627EEA"/>
    <text x="274" y="46" fill="#EAECEF" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700">ETH</text>
    <text x="240" y="84" fill="#EAECEF" font-family="IBM Plex Mono, Consolas, monospace" font-size="22" font-weight="700">$1,914</text>
    <text x="240" y="106" fill="#0ECB81" font-family="IBM Plex Mono, Consolas, monospace" font-size="14" font-weight="600">+2.30%</text>

    <!-- F&G card -->
    <rect y="134" width="416" height="100" rx="16" fill="url(#card)" stroke="#2B3139"/>
    <text x="24" y="168" fill="#707A8A" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">FEAR &amp; GREED</text>
    <text x="24" y="210" fill="#F6465D" font-family="IBM Plex Mono, Consolas, monospace" font-size="36" font-weight="700">25</text>
    <text x="100" y="208" fill="#EAECEF" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600">Sợ hãi cực độ</text>
    <!-- mini bar -->
    <rect x="24" y="224" width="368" height="6" rx="3" fill="#2B3139"/>
    <rect x="24" y="224" width="92" height="6" rx="3" fill="#F6465D"/>

    <!-- SOL card bottom -->
    <rect y="250" width="200" height="90" rx="16" fill="url(#card)" stroke="#2B3139"/>
    <text x="24" y="286" fill="#929AA5" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">SOL</text>
    <text x="24" y="318" fill="#EAECEF" font-family="IBM Plex Mono, Consolas, monospace" font-size="20" font-weight="700">$73.87</text>

    <rect x="216" y="250" width="200" height="90" rx="16" fill="url(#card)" stroke="#2B3139"/>
    <text x="240" y="286" fill="#929AA5" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">LIVE</text>
    <circle cx="290" cy="281" r="5" fill="#0ECB81"/>
    <text x="240" y="318" fill="#0ECB81" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700">Trực tiếp</text>
  </g>

  <!-- Footer line -->
  <text x="72" y="580" fill="#707A8A" font-family="Segoe UI, system-ui, sans-serif" font-size="16">crypto-market-vn.pages.dev · Tham khảo, không phải tư vấn đầu tư</text>
</svg>
