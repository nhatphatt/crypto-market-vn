<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0E11"/>
      <stop offset="1" stop-color="#141920"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FCD535"/>
      <stop offset="1" stop-color="#E5A911"/>
    </linearGradient>
    <radialGradient id="orb" cx="82%" cy="18%" r="42%">
      <stop offset="0%" stop-color="#FCD535" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FCD535" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbG" cx="12%" cy="88%" r="35%">
      <stop offset="0%" stop-color="#0ECB81" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0ECB81" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="630" fill="url(#bg)"/>
