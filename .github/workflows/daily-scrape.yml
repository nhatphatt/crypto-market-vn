# Auto scrape news -> commit data -> Cloudflare rebuild via git push
name: news-scrape

on:
  schedule:
    # Every 6 hours UTC
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Scrape RSS + featured images
        run: npm run scrape
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json public/images/posts || true
          if git diff --staged --quiet; then
            echo "No news changes."
          else
            git commit -m "chore(news): auto scrape $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "Pushed — redeploy CF after connect or re-run deploy."
          fi
