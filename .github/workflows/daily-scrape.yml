# Scrape tin + markets snapshot + build + deploy Pages
# Giữ runtime < 45p: limit scrape/snapshot trên CI
name: news-scrape

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-scrape
  cancel-in-progress: true

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax-check scrape
        run: node --check scripts/scrape-news.mjs

      - name: Scrape RSS (CI limits)
        continue-on-error: true
        run: npm run scrape
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # Số bài MỚI tối đa mỗi lần chạy. Bài cũ luôn được giữ nguyên.
          SCRAPE_MAX_POSTS: "60"
          SCRAPE_PER_FEED: "12"
          SCRAPE_ARCHIVE_MAX: "1000"

      - name: Markets snapshot (CI limits)
        continue-on-error: true
        run: npm run snapshot
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          SNAPSHOT_DETAIL_N: "12"

      - name: Guard - không cho phép mất bài
        run: |
          node -e "
          const fs=require('fs');
          const cur=JSON.parse(fs.readFileSync('data/news.json','utf8')).posts.length;
          const { execSync }=require('child_process');
          let old=0;
          try { old=JSON.parse(execSync('git show HEAD:data/news.json').toString()).posts.length; } catch(e){}
          console.log('Bài trước:', old, '→ sau:', cur);
          if (cur < old) { console.error('✗ Số bài GIẢM. Huỷ commit để tránh mất bài.'); process.exit(1); }
          console.log('✓ Không mất bài.');
          "

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/markets-snapshot.json public/images/posts || true
          if git diff --staged --quiet; then
            echo "No data file changes."
          else
            git commit -m "chore(data): news + markets snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Static export build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://crypto-market-vn.pages.dev

      - name: Deploy Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Thiếu CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID."
            echo "::error::Cào tin xong nhưng KHÔNG deploy được → web không có tin mới."
            echo "::error::Thêm secrets tại: Settings → Secrets and variables → Actions"
            exit 1
          fi
          npx wrangler pages deploy out --project-name=crypto-market-vn --commit-dirty=true
