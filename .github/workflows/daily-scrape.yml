# Scrape tin + markets snapshot + build + deploy Pages
# Giữ runtime < 45p: limit scrape/snapshot trên CI
name: news-scrape

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-scrape
  cancel-in-progress: true

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax-check scrape
        run: node --check scripts/scrape-news.mjs

      - name: Scrape RSS (CI limits)
        continue-on-error: true
        run: npm run scrape
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          SCRAPE_MAX_POSTS: "100"
          SCRAPE_PER_FEED: "12"

      - name: Markets snapshot (CI limits)
        continue-on-error: true
        run: npm run snapshot
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          SNAPSHOT_DETAIL_N: "12"

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/markets-snapshot.json public/images/posts || true
          if git diff --staged --quiet; then
            echo "No data file changes."
          else
            git commit -m "chore(data): news + markets snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Static export build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://crypto-market-vn.pages.dev

      - name: Deploy Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Skip deploy: set CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets."
            exit 0
          fi
          npx wrangler pages deploy out --project-name=crypto-market-vn --commit-dirty=true
