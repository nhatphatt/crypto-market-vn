# Cào tin tự động → commit data → Cloudflare Pages (GitHub integration) auto-deploy
name: Cào tin tự động

on:
  schedule:
    # Mỗi 6 giờ UTC → tin cập nhật 4 lần/ngày (không phụ thuộc máy local)
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Token mặc định đủ push nếu repo settings cho Actions write
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cài dependency
        run: npm ci

      - name: Cào RSS + generate ảnh featured
        run: npm run scrape
        env:
          # Tránh hang quá lâu trên CI
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Commit & push nếu có tin mới
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json public/images/posts || true
          if git diff --staged --quiet; then
            echo "Không có thay đổi tin."
          else
            git commit -m "chore(news): auto scrape $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "Đã push — Cloudflare Pages sẽ rebuild."
          fi
