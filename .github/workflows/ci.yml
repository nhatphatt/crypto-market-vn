# Kiểm tra build trước khi merge / trên main
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck + production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://crypto-market-vn.pages.dev
